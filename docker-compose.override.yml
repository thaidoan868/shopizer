services:
  shopizer-user-service:
    container_name: shopizer-user-service
    image: thaidoan868/shopizer-user-service:latest
    #    build:
    #      context: .
    #      dockerfile: shopizer-user-service/Dockerfile
    env_file:
      - .env.staging.example
      - .env

    ports:
      - "8082:8082"
      - "9100:9100"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9100/actuator/health/liveness" ]
      interval: 5s
      timeout: 5s
      retries: 10

    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


    restart: unless-stopped
    networks:
      - appnet