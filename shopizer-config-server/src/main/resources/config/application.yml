server:
  port: 8080
management:
  server:
    port: 9000
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never

otel:
  # send traces only
  exporter:
    otlp:
      endpoint: http://jaeger:4317
      protocol: grpc
  metrics:
    exporter: none
  logs:
    exporter: none
  resource:
    attributes:
      service.name: shopizer
  traces:
    sampler: always_on
    exporter: otlp