server:
  port: 8082

spring:
  application:
    name: user-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Database Configuration (PostgreSQL prioritized over H2)
  datasource:
    url: jdbc:postgresql://localhost:5432/shopizer
    driver-class-name: org.postgresql.Driver
    username: app_user
    password: app_user_password

  # JPA & Hibernate Configuration
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      javax:
        persistence:
          validation:
            mode: auto

  # Database Migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # Message Broker
  rabbitmq:
    host: localhost
    port: 5672
    username: rabitmqadmin
    password: rabitmqadminpassword
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/shopizer
          jwk-set-uri: http://localhost:8080/realms/shopizer/protocol/openid-connect/certs

  # JSON Serialization
  jackson:
    default-property-inclusion: non_null

  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: "your-email@gmail.com"
    from-display-name: "Shopizer Agent"
    password: "app-password"
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Actuator & Management
management:
  server:
    port: 9100
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
#  otlp:
#    tracing:
#      endpoint: http://jaeger:4318/v1/traces

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

# Logging Configuration
logging:
  level:
    root: INFO
    vn.io.oldmoon.shopizer: info
  pattern:
    level: "%5p"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{correlationId}] - %msg%n"

# Keycloak Configuration
keycloak:
  server-url: http://localhost:8080
  realm: shopizer
  client-id: user-service
  client-secret: qr8Qw6vQodFh3ipb1uNUBiaRo6JtkQwB


# Object Storage (MinIO)
minio:
  bucket:
    avatar-public: "avatar-public"
  endpoint: http://localhost:9000
  access-key: "shopizer-access-key"
  secret-key: "shopizer-secret-key"
  secure: false