server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/shopizer
    driver-class-name: org.postgresql.Driver
    username: postgresadmin
    password: adminpassword

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      javax:
        persistence:
          validation:
            mode: auto

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/shopizer
management:
  server:
    port: 9000
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

keycloak:
  server-url: http://localhost:8080

  realm: shopizer
  client-id: backend
  client-secret: APYtOv32HuVupfco6m0ltbf0RcXp1atx
