server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/shopizer
    driver-class-name: org.postgresql.Driver
    username: postgresadmin
    password: adminpassword

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/shopizer
management:
  server:
    port: 9000
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces
