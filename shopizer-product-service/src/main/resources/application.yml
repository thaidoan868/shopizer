server:
  port: 8083

spring:
  application:
    name: product-service
  rabbitmq:
    host: localhost
    port: 5672
    username: rabitmqadmin
    password: rabitmqadminpassword
    virtual-host: /
    # Reliability settings
    publisher-confirm-type: correlated
    publisher-returns: true

  datasource:
    url: jdbc:postgresql://localhost:5432/shopizer_product_service
    driver-class-name: org.postgresql.Driver
    username: app_user
    password: app_user_password

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
      jakarta:
        persistence:
          validation:
            mode: auto

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Merged both JWT configurations
          #issuer-uri: http://localhost:8080/realms/shopizer
          jwk-set-uri: http://localhost:8080/realms/shopizer/protocol/openid-connect/certs

  jackson:
    default-property-inclusion: non_null

management:
  server:
    port: 9003
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always

# Documentation
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

logging:
  level:
    root: INFO
    vn.io.oldmoon.shopizer: TRACE
  pattern:
    level: "%5p"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{correlationId}] - %msg%n"


sentry:
  dsn: "https://your-public-key@o0.ingest.sentry.io/0"
  send-default-pii: true
  traces-sample-rate: 0.2
  exception-resolver-order: -2147483647