server:
  port: 8081

cloud:
  gateway:
    routes:
      - id: user-service
        uri: http://user-service:8080
        predicates:
          - Path=/api/v*/users/**
      - id: product-service
        uri: http://product-service:8080
        predicates:
          - Path=/api/v*/products/**
management:
  server:
    port: 9001