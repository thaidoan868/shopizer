server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v*/users/**
        - id: access-token
          uri: http://localhost:8080
          predicates:
            - Path=/api/access-token
          filters:
            - SetPath=/realms/shopizer/protocol/openid-connect/token


management:
  server:
    port: 9001
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always